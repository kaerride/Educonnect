<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduConnect — Sistema Acadêmico Integrado</title>
    
    <!-- Favicon do Capelo Acadêmico -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f46e5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M22 10v6M2 10l10-5 10 5-10 5z'/><path d='M6 12v5c3 3 9 3 12 0v-5'/></svg>">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- GSAP Animation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        },
                        emeraldCustom: '#10b981'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(229, 231, 235, 0.8);
        }
        .dark .glass-panel {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(55, 65, 81, 0.8);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }

        /* Estilo do Carrossel de Anúncios do Campus */
        .campus-slider {
            position: relative;
            height: 240px;
            border-radius: 1.5rem;
            overflow: hidden;
        }
        .campus-slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.7s ease-in-out;
            background-size: cover;
            background-position: center;
        }
        .campus-slide.active {
            opacity: 1;
            z-index: 1;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-200 antialiased">

    <!-- APP CONTAINER -->
    <div id="app" class="flex h-screen overflow-hidden">

        <!-- SIDEBAR -->
        <aside id="sidebar" class="w-64 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 flex flex-col justify-between transition-all duration-300 z-30 fixed md:relative h-full -translate-x-full md:translate-x-0">
            <div>
                <!-- Brand Header -->
                <div class="h-16 flex items-center justify-between px-6 border-b border-slate-100 dark:border-slate-700/50">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-xl bg-brand-600 flex items-center justify-center text-white shadow-lg shadow-brand-500/30">
                            <i class="fa-solid fa-graduation-cap text-lg"></i>
                        </div>
                        <span class="font-bold text-xl tracking-tight bg-gradient-to-r from-brand-600 to-indigo-500 bg-clip-text text-transparent">EduConnect</span>
                    </div>
                    <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-slate-600">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>

                <!-- Navigation Links -->
                <nav class="p-4 space-y-1 custom-scrollbar overflow-y-auto max-h-[calc(100vh-180px)]" id="nav-menu">
                    <!-- Dynamic Nav Items via JS -->
                </nav>
            </div>

            <!-- API Status & Profile -->
            <div>
                <div class="px-4 py-2 text-xs text-emerald-600 dark:text-emerald-400 flex items-center gap-2 font-medium border-t border-slate-100 dark:border-slate-700/50">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Google Sheets API On
                </div>
                <!-- User Profile Bottom Bar -->
                <div class="p-4 border-t border-slate-100 dark:border-slate-700/50 flex items-center justify-between">
                    <div class="flex items-center gap-3 cursor-pointer" onclick="navigate('perfil')">
                        <img id="user-avatar-sidebar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=150" alt="Avatar" class="w-10 h-10 rounded-full object-cover border-2 border-brand-500">
                        <div class="overflow-hidden">
                            <p id="user-name-sidebar" class="text-sm font-semibold text-slate-800 dark:text-slate-200 truncate">Maria Silva</p>
                            <p id="user-role-sidebar" class="text-xs text-slate-500 dark:text-slate-400 truncate">Aluno • Eng. de Software</p>
                        </div>
                    </div>
                    <button onclick="toggleUserRole()" title="Alternar Visão (Aluno/Professor)" class="text-slate-400 hover:text-brand-600 p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">
                        <i class="fa-solid fa-arrows-rotate"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

            <!-- TOP NAVBAR -->
            <header class="h-16 bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 flex items-center justify-between px-4 md:px-8 z-20">
                <div class="flex items-center gap-4">
                    <button onclick="toggleSidebar()" class="md:hidden text-slate-600 dark:text-slate-300 p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">
                        <i class="fa-solid fa-bars text-lg"></i>
                    </button>
                    <div class="relative hidden sm:block">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input type="text" placeholder="Buscar disciplinas, avisos, salas..." class="w-64 pl-9 pr-4 py-1.5 text-sm rounded-full border border-slate-200 dark:border-slate-600 dark:bg-slate-700 focus:outline-none focus:border-brand-500 dark:focus:border-brand-500 transition-all">
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <!-- Role Indicator Badge -->
                    <span id="role-badge" class="px-2.5 py-1 text-xs font-semibold rounded-full bg-brand-50 text-brand-600 dark:bg-brand-900/40 dark:text-brand-300 border border-brand-200 dark:border-brand-800">
                        Modo Aluno
                    </span>

                    <!-- Dark Mode Toggle -->
                    <button onclick="toggleDarkMode()" class="p-2 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-full transition-colors">
                        <i id="theme-icon" class="fa-solid fa-moon"></i>
                    </button>

                    <!-- Webmail Indicator -->
                    <button onclick="navigate('webmail')" class="relative p-2 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-full transition-colors">
                        <i class="fa-solid fa-envelope"></i>
                        <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                    </button>

                    <!-- Notifications Button -->
                    <button onclick="showToast('Sua solicitação de sala foi aprovada!')" class="relative p-2 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-full transition-colors">
                        <i class="fa-solid fa-bell"></i>
                        <span class="absolute top-1 right-1 w-2 h-2 bg-brand-500 rounded-full"></span>
                    </button>
                </div>
            </header>

            <!-- VIEW CONTAINER -->
            <main id="main-view" class="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar">
                <!-- Dynamic Pages Injected Here -->
            </main>
        </div>
    </div>

    <!-- MODAL RESERVA DE SALAS DE ESTUDO -->
    <div id="modal-sala" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 dark:border-slate-700">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold dark:text-white">Reservar Sala de Estudo</h3>
                <button onclick="closeModal('modal-sala')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="confirmarReservaSala(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">SALA SELECIONADA</label>
                    <input type="text" id="sala-nome-modal" readonly class="w-full bg-slate-100 dark:bg-slate-700 font-medium px-3 py-2 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">NOME DO ALUNO / GRUPO</label>
                    <input type="text" id="reser-aluno-modal" placeholder="Ex: Maria Silva" required class="w-full border border-slate-200 dark:border-slate-600 dark:bg-slate-700 rounded-lg px-3 py-2 text-sm">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">DATA</label>
                        <input type="date" id="reser-data-modal" required class="w-full border border-slate-200 dark:border-slate-600 dark:bg-slate-700 rounded-lg px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">HORÁRIO</label>
                        <select id="reser-horario-modal" required class="w-full border border-slate-200 dark:border-slate-600 dark:bg-slate-700 rounded-lg px-3 py-2 text-sm">
                            <option value="08:00 - 10:00">08:00 - 10:00</option>
                            <option value="10:00 - 12:00">10:00 - 12:00</option>
                            <option value="14:00 - 16:00">14:00 - 16:00</option>
                            <option value="19:00 - 21:00">19:00 - 21:00</option>
                        </select>
                    </div>
                </div>
                <button type="submit" id="btn-sub-reserva" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-2.5 rounded-xl shadow-lg shadow-brand-500/20 transition-all">Confirmar e Enviar para o Sistema</button>
            </form>
        </div>
    </div>

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

    <script>
        // URL DA SUA API GOOGLE APPS SCRIPT
        const API_URL = "https://script.google.com/macros/s/AKfycbx37HaqrZwmhpL0dCJbzp9wCdMxg3_q-CtUDLfLTs2kZv-L80fI2TjHLaOb_l4575gLBg/exec";

        // GLOBAL STATE
        let currentUserRole = 'aluno'; // 'aluno' ou 'professor'
        let currentView = 'dashboard';
        let currentCarouselIndex = 0;
        let carouselInterval = null;

        // MOCK DATA STORE
        const mockData = {
            disciplinas: [
                { id: 1, nome: "Programação FrontEnd SPA", prof: "Profa. Ana", progresso: 78, cor: "from-blue-500 to-indigo-600", icone: "fa-code" },
                { id: 2, nome: "UX/UI Design System", prof: "Prof. Carlos", progresso: 64, cor: "from-purple-500 to-pink-600", icone: "fa-palette" },
                { id: 3, nome: "Banco de Dados NoSQL", prof: "Profa. Marina", progresso: 86, cor: "from-emerald-500 to-teal-600", icone: "fa-database" },
                { id: 4, nome: "Engenharia de Software", prof: "Prof. Roberto", progresso: 92, cor: "from-amber-500 to-orange-600", icone: "fa-gears" }
            ],
            notas: [
                { disciplina: "Programação FrontEnd SPA", p1: 9.2, p2: 8.8, trabalho: 10.0, media: 9.3, status: "Aprovado" },
                { disciplina: "UX/UI Design System", p1: 8.5, p2: 8.0, trabalho: 9.5, media: 8.7, status: "Aprovado" },
                { disciplina: "Banco de Dados NoSQL", p1: 7.8, p2: 8.2, trabalho: 8.5, media: 8.1, status: "Aprovado" },
                { disciplina: "Engenharia de Software", p1: 9.5, p2: 9.0, trabalho: 9.8, media: 9.4, status: "Aprovado" }
            ],
            salasEstudo: [
                { id: 'A101', nome: "Sala de Estudos - Bloco A #101", capacidade: "4 pessoas", recurso: "Lousa Digital & TV", status: "Livre" },
                { id: 'A102', nome: "Sala de Estudos - Bloco A #102", capacidade: "6 pessoas", recurso: "Projetor & Ar Condicionado", status: "Ocupada" },
                { id: 'B205', nome: "Sala Mac / Design Lab", capacidade: "8 pessoas", recurso: "Workstations & Monitor Ultrawide", status: "Livre" },
                { id: 'C301', nome: "Espaço Silencioso Individual", capacidade: "1 pessoa", recurso: "Tomadas & Isolamento Acústico", status: "Livre" }
            ],
            avisos: [
                { data: "26 Out", titulo: "Feira de Projetos TecEdu 2026", desc: "Inscrições abertas para submissão de trabalhos no campus." },
                { data: "28 Out", titulo: "Torneio Interclasse de Futebol", desc: "Jogos no ginásio principal a partir das 18h." }
            ],
            campusPhotos: [
                { title: "Feira de Tecnologia & Ciência 2026", tag: "Inscrições Abertas", desc: "Apresente seus projetos para grandes empresas parceiras da faculdade.", img: "https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=1200&q=80" },
                { title: "Campeonato Interclasse de Basquete & Futebol", tag: "Esportes no Campus", desc: "Monte seu time e represente seu curso na competição anual do ginásio.", img: "https://images.unsplash.com/photo-1546519638-68e109498ffc?auto=format&fit=crop&w=1200&q=80" },
                { title: "Palestra: O Futuro da Inteligência Artificial", tag: "Auditório Central", desc: "Evento com certificado de horas complementares ministrado por especialistas.", img: "https://images.unsplash.com/photo-1475721027785-f74eccf877e2?auto=format&fit=crop&w=1200&q=80" }
            ],
            livros: [
                { titulo: "Design Systems no Mundo Real", autor: "Carlos Eduardo", ano: "2024", cat: "UX/UI", icone: "fa-book" },
                { titulo: "Arquitetura de SPA com React & Vite", autor: "Ana Paula Souza", ano: "2025", cat: "FrontEnd", icone: "fa-code" },
                { titulo: "Modelagem NoSQL e Alta Performance", autor: "Marina R. Lima", ano: "2023", cat: "Banco de Dados", icone: "fa-database" },
                { titulo: "Engenharia de Software Moderna", autor: "Roberto Silva", ano: "2026", cat: "Engenharia", icone: "fa-gears" }
            ],
            emails: [
                { de: "Secretaria Acadêmica", assunto: "Confirmação de Matrícula 2026.2", data: "Hoje, 14:30", desc: "Sua matrícula foi processada com sucesso no sistema central." },
                { de: "Profa. Ana Paula", assunto: "Lembrete: Entrega do Projeto de FrontEnd", data: "Ontem, 09:15", desc: "Não se esqueçam de enviar o link do repositório até o final da semana." },
                { de: "Biblioteca Central", assunto: "Reserva de Sala de Estudos Aprovada", data: "24 Out", desc: "Sua solicitação para a Sala #101 foi confirmada para o horário agendado." }
            ]
        };

        // NAVIGATION CONFIG
        const navItems = [
            { id: 'dashboard', label: 'Início', icon: 'fa-house', roles: ['aluno', 'professor'] },
            { id: 'cursos', label: 'Disciplinas', icon: 'fa-book-open', roles: ['aluno', 'professor'] },
            { id: 'salas', label: 'Salas de Estudo', icon: 'fa-door-open', roles: ['aluno', 'professor'] },
            { id: 'notas', label: 'Notas & Atividades', icon: 'fa-chart-line', roles: ['aluno'] },
            { id: 'professor-painel', label: 'Painel Docente', icon: 'fa-chalkboard-user', roles: ['professor'] },
            { id: 'biblioteca', label: 'Biblioteca Virtual', icon: 'fa-book-bookmark', roles: ['aluno', 'professor'] },
            { id: 'webmail', label: 'Webmail', icon: 'fa-envelope', roles: ['aluno', 'professor'] },
            { id: 'sac', label: 'Atendimento / SAC', icon: 'fa-headset', roles: ['aluno', 'professor'] },
            { id: 'perfil', label: 'Meu Perfil', icon: 'fa-user', roles: ['aluno', 'professor'] }
        ];

        // INITIALIZATION
        window.onload = function() {
            renderSidebar();
            navigate('dashboard');
        };

        // RENDER SIDEBAR
        function renderSidebar() {
            const menu = document.getElementById('nav-menu');
            menu.innerHTML = '';

            navItems.forEach(item => {
                if (item.roles.includes(currentUserRole)) {
                    const activeClass = currentView === item.id 
                        ? 'bg-brand-50 text-brand-600 dark:bg-brand-900/40 dark:text-brand-300 font-semibold' 
                        : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700/50';

                    menu.innerHTML += `
                        <button onclick="navigate('${item.id}')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm transition-all duration-150 ${activeClass}">
                            <i class="fa-solid ${item.icon} w-5 text-center"></i>
                            <span>${item.label}</span>
                        </button>
                    `;
                }
            });
        }

        // NAVIGATION ENGINE
        function navigate(viewId) {
            currentView = viewId;
            if (carouselInterval) clearInterval(carouselInterval);
            renderSidebar();
            const main = document.getElementById('main-view');
            
            gsap.to(main, { opacity: 0, y: 10, duration: 0.15, onComplete: () => {
                main.innerHTML = getPageTemplate(viewId);
                animatePageElements();
                if (viewId === 'dashboard') startCarouselTimer();
                gsap.to(main, { opacity: 1, y: 0, duration: 0.25 });
            }});

            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
            }
        }

        // STAT CARD HELPER
        function renderStatCard(title, val, icon, color, sub) {
            return `
                <div data-animate class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">${title}</p>
                        <h3 class="text-2xl font-bold dark:text-white mt-1">${val}</h3>
                        <span class="text-[11px] text-slate-400">${sub}</span>
                    </div>
                    <div class="w-12 h-12 rounded-xl bg-slate-100 dark:bg-slate-700 flex items-center justify-center ${color} text-xl">
                        <i class="fa-solid ${icon}"></i>
                    </div>
                </div>
            `;
        }

        // CARROSSEL TIMER
        function startCarouselTimer() {
            carouselInterval = setInterval(() => {
                const slides = document.querySelectorAll('.campus-slide');
                if (slides.length > 0) {
                    slides.forEach(s => s.classList.remove('active'));
                    currentCarouselIndex = (currentCarouselIndex + 1) % slides.length;
                    slides[currentCarouselIndex].classList.add('active');
                }
            }, 4500);
        }

        // PAGE TEMPLATES COMPLETOS
        function getPageTemplate(viewId) {
            switch(viewId) {
                case 'dashboard':
                    return `
                        <div class="space-y-6">
                            <!-- CARROSSEL DE FOTOS DO CAMPUS E AVISOS -->
                            <div data-animate class="campus-slider shadow-xl">
                                ${mockData.campusPhotos.map((photo, i) => `
                                    <div class="campus-slide ${i === 0 ? 'active' : ''}" style="background-image: linear-gradient(90deg, rgba(15, 23, 42, 0.9) 0%, rgba(15, 23, 42, 0.35) 100%), url('${photo.img}')">
                                        <div class="p-6 md:p-8 flex flex-col justify-center h-full max-w-xl text-white">
                                            <span class="inline-block px-3 py-1 bg-brand-600 text-white rounded-full text-xs font-bold w-max mb-2">${photo.tag}</span>
                                            <h2 class="text-2xl md:text-3xl font-extrabold mb-2">${photo.title}</h2>
                                            <p class="text-slate-200 text-sm mb-4">${photo.desc}</p>
                                            <button onclick="navigate('salas')" class="bg-white text-slate-900 px-4 py-2 rounded-xl text-xs font-bold w-max hover:bg-brand-50 transition-all">
                                                Saber Mais
                                            </button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>

                            <!-- Hero Banner Original -->
                            <div data-animate class="relative overflow-hidden rounded-3xl bg-gradient-to-r from-brand-600 via-indigo-600 to-purple-600 p-6 md:p-8 text-white shadow-xl">
                                <div class="relative z-10 max-w-xl">
                                    <span class="inline-block px-3 py-1 bg-white/20 backdrop-blur-md rounded-full text-xs font-semibold mb-3">Portal Acadêmico 2026</span>
                                    <h1 class="text-2xl md:text-4xl font-extrabold tracking-tight mb-2">Bem-vindo(a) ao EduConnect!</h1>
                                    <p class="text-brand-100 text-sm md:text-base mb-6">Acompanhe suas aulas, gerencie entregas, agende salas de estudo e mantenha-se em dia com sua rotina universitária.</p>
                                    <div class="flex flex-wrap gap-3">
                                        <button onclick="navigate('salas')" class="bg-white text-brand-600 hover:bg-brand-50 px-5 py-2.5 rounded-xl font-bold text-sm shadow-md transition-all">
                                            <i class="fa-solid fa-calendar-plus mr-2"></i>Reservar Sala de Estudo
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <!-- Metrics Grid -->
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                ${renderStatCard("CR Geral", "8,9", "fa-chart-line", "text-emerald-500", "Top 5% da turma")}
                                ${renderStatCard("Frequência", "96%", "fa-user-check", "text-blue-500", "Excelente marca")}
                                ${renderStatCard("Atividades", "12/14", "fa-list-check", "text-purple-500", "2 pendentes")}
                                ${renderStatCard("Livros Salvos", "5", "fa-bookmark", "text-amber-500", "Biblioteca Virtual")}
                            </div>
                        </div>
                    `;

                case 'cursos':
                    return `
                        <div class="space-y-6">
                            <div data-animate class="flex justify-between items-center">
                                <div>
                                    <h1 class="text-2xl font-bold dark:text-white">Minhas Disciplinas</h1>
                                    <p class="text-sm text-slate-500">Acesse conteúdos, materiais e acompanhe o progresso do semestre.</p>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                ${mockData.disciplinas.map(c => `
                                    <div data-animate class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">
                                        <div class="h-28 bg-gradient-to-r ${c.cor} p-6 flex justify-between items-start text-white">
                                            <div>

        // UTILITY FUNCTIONS & HANDLERS

        function animatePageElements() {
            gsap.from("[data-animate]", {
                opacity: 0,
                y: 15,
                duration: 0.4,
                stagger: 0.08,
                ease: "power2.out"
            });
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            const icon = document.getElementById('theme-icon');
            icon.classList.toggle('fa-moon');
            icon.classList.toggle('fa-sun');
        }

        function toggleUserRole() {
            currentUserRole = currentUserRole === 'aluno' ? 'professor' : 'aluno';
            document.getElementById('role-badge').innerText = currentUserRole === 'aluno' ? 'Modo Aluno' : 'Modo Professor';
            document.getElementById('user-role-sidebar').innerText = currentUserRole === 'aluno' ? 'Aluno • Eng. de Software' : 'Professor • Docente';
            renderSidebar();
            navigate(currentUserRole === 'professor' ? 'professor-painel' : 'dashboard');
            showToast(`Alternado para ${currentUserRole === 'aluno' ? 'Visão do Aluno' : 'Painel do Professor'}`);
        }

        function openModalSala(nomeSala) {
            document.getElementById('sala-nome-modal').value = nomeSala;
            document.getElementById('modal-sala').classList.remove('hidden');
            document.getElementById('modal-sala').classList.add('flex');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
            document.getElementById(modalId).classList.remove('flex');
        }

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-slate-900 text-white dark:bg-white dark:text-slate-900 px-4 py-3 rounded-xl shadow-2xl text-xs font-semibold flex items-center gap-2';
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i> ${msg}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        // GOOGLE APPS SCRIPT HANDLERS (API INTEGRATION)

        async function confirmarReservaSala(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-sub-reserva');
            btn.innerText = "Enviando para o Google Sheets...";
            btn.disabled = true;

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'reservarSala',
                        sala: document.getElementById('sala-nome-modal').value,
                        aluno: document.getElementById('reser-aluno-modal').value,
                        data: document.getElementById('reser-data-modal').value,
                        horario: document.getElementById('reser-horario-modal').value
                    })
                });
                const data = await res.json();
                closeModal('modal-sala');
                showToast(data.message || "Reserva efetuada na planilha!");
            } catch(err) {
                showToast("Erro ao conectar com a API.");
            } finally {
                btn.innerText = "Confirmar e Enviar para o Sistema";
                btn.disabled = false;
            }
        }

        async function handleEnviarAtividadeAPI(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-env-atv');
            btn.innerText = "Enviando...";
            btn.disabled = true;

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'enviarAtividade',
                        disciplina: document.getElementById('atv-disc').value,
                        aluno: document.getElementById('atv-aluno').value,
                        linkArquivo: document.getElementById('atv-link').value
                    })
                });
                const data = await res.json();
                showToast(data.message || "Trabalho enviado ao professor!");
                e.target.reset();
            } catch(err) {
                showToast("Erro ao enviar atividade.");
            } finally {
                btn.innerText = "Enviar Atividade";
                btn.disabled = false;
            }
        }

        async function handleLancarNotaAPI(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-lan-nota');
            btn.innerText = "Registrando...";
            btn.disabled = true;

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'lancarNota',
                        disciplina: document.getElementById('nota-disc').value,
                        aluno: document.getElementById('nota-aluno').value,
                        nota: document.getElementById('nota-val').value
                    })
                });
                const data = await res.json();
                showToast(data.message || "Nota lançada na planilha!");
                e.target.reset();
            } catch(err) {
                showToast("Erro ao registrar nota.");
            } finally {
                btn.innerText = "Registrar Nota na Planilha";
                btn.disabled = false;
            }
        }

        async function handleSACAPI(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-env-sac');
            btn.innerText = "Abrindo Chamado...";
            btn.disabled = true;

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'enviarSAC',
                        aluno: document.getElementById('sac-aluno').value,
                        assunto: document.getElementById('sac-assunto').value,
                        mensagem: document.getElementById('sac-msg').value
                    })
                });
                const data = await res.json();
                showToast(data.message || "Protocolo aberto com sucesso!");
                e.target.reset();
            } catch(err) {
                showToast("Erro ao abrir protocolo.");
            } finally {
                btn.innerText = "Enviar Protocolo ao SAC";
                btn.disabled = false;
            }
        }
    </script>
