<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f46e5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M22 10v6M2 10l10-5 10 5-10 5z'/><path d='M6 12v5c3 3 9 3 12 0v-5'/></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduConnect — Sistema Acadêmico Integrado</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- GSAP Animation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        },
                        emeraldCustom: '#10b981'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(229, 231, 235, 0.8);
        }
        .dark .glass-panel {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(55, 65, 81, 0.8);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-200 antialiased">

    <!-- APP CONTAINER -->
    <div id="app" class="flex h-screen overflow-hidden">

        <!-- SIDEBAR -->
        <aside id="sidebar" class="w-64 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 flex flex-col justify-between transition-all duration-300 z-30 fixed md:relative h-full -translate-x-full md:translate-x-0">
            <div>
                <!-- Brand Header -->
                <div class="h-16 flex items-center justify-between px-6 border-b border-slate-100 dark:border-slate-700/50">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-xl bg-brand-600 flex items-center justify-center text-white shadow-lg shadow-brand-500/30">
                            <i class="fa-solid fa-graduation-cap text-lg"></i>
                        </div>
                        <span class="font-bold text-xl tracking-tight bg-gradient-to-r from-brand-600 to-indigo-500 bg-clip-text text-transparent">EduConnect</span>
                    </div>
                    <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-slate-600">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>

                <!-- Navigation Links -->
                <nav class="p-4 space-y-1 custom-scrollbar overflow-y-auto max-h-[calc(100vh-140px)]" id="nav-menu">
                    <!-- Dynamic Nav Items via JS -->
                </nav>
            </div>

            <!-- User Profile Bottom Bar -->
            <div class="p-4 border-t border-slate-100 dark:border-slate-700/50 flex items-center justify-between">
                <div class="flex items-center gap-3 cursor-pointer" onclick="navigate('perfil')">
                    <img id="user-avatar-sidebar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=150" alt="Avatar" class="w-10 h-10 rounded-full object-cover border-2 border-brand-500">
                    <div class="overflow-hidden">
                        <p id="user-name-sidebar" class="text-sm font-semibold text-slate-800 dark:text-slate-200 truncate">Maria Silva</p>
                        <p id="user-role-sidebar" class="text-xs text-slate-500 dark:text-slate-400 truncate">Aluno • Eng. de Software</p>
                    </div>
                </div>
                <button onclick="toggleUserRole()" title="Alternar Visão (Aluno/Professor)" class="text-slate-400 hover:text-brand-600 p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">
                    <i class="fa-solid fa-arrows-rotate"></i>
                </button>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

            <!-- TOP NAVBAR -->
            <header class="h-16 bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 flex items-center justify-between px-4 md:px-8 z-20">
                <div class="flex items-center gap-4">
                    <button onclick="toggleSidebar()" class="md:hidden text-slate-600 dark:text-slate-300 p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">
                        <i class="fa-solid fa-bars text-lg"></i>
                    </button>
                    <div class="relative hidden sm:block">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input type="text" placeholder="Buscar disciplinas, avisos, salas..." class="w-64 pl-9 pr-4 py-1.5 text-sm rounded-full border border-slate-200 dark:border-slate-600 dark:bg-slate-700 focus:outline-none focus:border-brand-500 dark:focus:border-brand-500 transition-all">
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <!-- Role Indicator Badge -->
                    <span id="role-badge" class="px-2.5 py-1 text-xs font-semibold rounded-full bg-brand-50 text-brand-600 dark:bg-brand-900/40 dark:text-brand-300 border border-brand-200 dark:border-brand-800">
                        Modo Aluno
                    </span>

                    <!-- Dark Mode Toggle -->
                    <button onclick="toggleDarkMode()" class="p-2 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-full transition-colors">
                        <i id="theme-icon" class="fa-solid fa-moon"></i>
                    </button>

                    <!-- Webmail Indicator -->
                    <button onclick="navigate('webmail')" class="relative p-2 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-full transition-colors">
                        <i class="fa-solid fa-envelope"></i>
                        <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                    </button>

                    <!-- Notifications Button -->
                    <button onclick="toggleNotifications()" class="relative p-2 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-full transition-colors">
                        <i class="fa-solid fa-bell"></i>
                        <span class="absolute top-1 right-1 w-2 h-2 bg-brand-500 rounded-full"></span>
                    </button>
                </div>
            </header>

            <!-- VIEW CONTAINER -->
            <main id="main-view" class="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar">
                <!-- Dynamic Pages Injected Here -->
            </main>
        </div>
    </div>

    <!-- MODAL RESERVA DE SALAS DE ESTUDO -->
    <div id="modal-sala" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 dark:border-slate-700">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold dark:text-white">Reservar Sala de Estudo</h3>
                <button onclick="closeModal('modal-sala')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="confirmarReservaSala(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">SALA SELECIONADA</label>
                    <input type="text" id="sala-nome-modal" readonly class="w-full bg-slate-100 dark:bg-slate-700 font-medium px-3 py-2 rounded-lg text-sm">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">DATA</label>
                        <input type="date" required class="w-full border border-slate-200 dark:border-slate-600 dark:bg-slate-700 rounded-lg px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">HORÁRIO</label>
                        <select required class="w-full border border-slate-200 dark:border-slate-600 dark:bg-slate-700 rounded-lg px-3 py-2 text-sm">
                            <option value="08:00">08:00 - 10:00</option>
                            <option value="10:00">10:00 - 12:00</option>
                            <option value="14:00">14:00 - 16:00</option>
                            <option value="16:00">18:00</option>
                            <option value="19:00">19:00 - 21:00</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">INTEGRANTES DO GRUPO</label>
                    <input type="text" placeholder="Ex: Maria, Carlos, João" required class="w-full border border-slate-200 dark:border-slate-600 dark:bg-slate-700 rounded-lg px-3 py-2 text-sm">
                </div>
                <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-2.5 rounded-xl shadow-lg shadow-brand-500/20 transition-all">Confirmar Agendamento</button>
            </form>
        </div>
    </div>

    <!-- TOAST NOTIFICATION CONTAINER -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

    <script>
        // GLOBAL STATE
        let currentUserRole = 'aluno'; // 'aluno' or 'professor'
        let currentView = 'dashboard';

        // MOCK DATA STORE
        const mockData = {
            disciplinas: [
                { id: 1, nome: "Programação FrontEnd SPA", prof: "Profa. Ana", progresso: 78, cor: "from-blue-500 to-indigo-600", icone: "fa-code" },
                { id: 2, nome: "UX/UI Design System", prof: "Prof. Carlos", progresso: 64, cor: "from-purple-500 to-pink-600", icone: "fa-palette" },
                { id: 3, nome: "Banco de Dados NoSQL", prof: "Profa. Marina", progresso: 86, cor: "from-emerald-500 to-teal-600", icone: "fa-database" },
                { id: 4, nome: "Engenharia de Software", prof: "Prof. Roberto", progresso: 92, cor: "from-amber-500 to-orange-600", icone: "fa-gears" }
            ],
            notas: [
                { disciplina: "Programação FrontEnd SPA", p1: 9.2, p2: 8.8, trabalho: 10.0, media: 9.3 },
                { disciplina: "UX/UI Design System", p1: 8.5, p2: 8.0, trabalho: 9.5, media: 8.7 },
                { disciplina: "Banco de Dados NoSQL", p1: 7.8, p2: 8.2, trabalho: 8.5, media: 8.1 },
                { disciplina: "Engenharia de Software", p1: 9.5, p2: 9.0, trabalho: 9.8, media: 9.4 }
            ],
            salasEstudo: [
                { id: 'A101', nome: "Sala de Estudos - Bloco A #101", capacidade: "4 pessoas", recurso: "Lousa Digital & TV", status: "Livre" },
                { id: 'A102', nome: "Sala de Estudos - Bloco A #102", capacidade: "6 pessoas", recurso: "Projetor & Ar Condicionado", status: "Ocupada" },
                { id: 'B205', nome: "Sala Mac / Design Lab", capacidade: "8 pessoas", recurso: "Workstations & Monitor Ultrawide", status: "Livre" },
                { id: 'C301', nome: "Espaço Silencioso Individual", capacidade: "1 pessoa", recurso: "Tomadas & Isolamento Acústico", status: "Livre" }
            ],
            avisos: [
                { data: "26 Out", titulo: "Feira de Projetos TecEdu 2026", desc: "Inscrições abertas para a submissão de trabalhos da feira acadêmica." },
                { data: "28 Out", titulo: "Manutenção na Rede Wi-Fi", desc: "O sinal estará instável nos blocos B e C entre 12h e 13h." }
            ],
            atividadesEnviadas: [
                { id: 1, titulo: "Atividade 1: Layout SPA com React & GSAP", disciplina: "Programação FrontEnd SPA", data: "2026-10-20", nota: "9.5", status: "Avaliada" },
                { id: 2, titulo: "Projeto de Banco de Dados Relacional", disciplina: "Banco de Dados NoSQL", data: "2026-10-25", nota: "--", status: "Pendente" }
            ]
        };

        // NAVIGATION CONFIG
        const navItems = [
            { id: 'dashboard', label: 'Início', icon: 'fa-house', roles: ['aluno', 'professor'] },
            { id: 'cursos', label: 'Disciplinas', icon: 'fa-book-open', roles: ['aluno', 'professor'] },
            { id: 'salas', label: 'Salas de Estudo', icon: 'fa-door-open', roles: ['aluno', 'professor'] },
            { id: 'notas', label: 'Notas & Atividades', icon: 'fa-chart-line', roles: ['aluno'] },
            { id: 'professor-painel', label: 'Painel Docente', icon: 'fa-chalkboard-user', roles: ['professor'] },
            { id: 'biblioteca', label: 'Biblioteca Virtual', icon: 'fa-book-bookmark', roles: ['aluno', 'professor'] },
            { id: 'webmail', label: 'Webmail', icon: 'fa-envelope', roles: ['aluno', 'professor'] },
            { id: 'sac', label: 'Atendimento / SAC', icon: 'fa-headset', roles: ['aluno', 'professor'] },
            { id: 'perfil', label: 'Meu Perfil', icon: 'fa-user', roles: ['aluno', 'professor'] }
        ];

        // INITIALIZATION
        window.onload = function() {
            renderSidebar();
            navigate('dashboard');
        };

        // RENDER SIDEBAR ACCORDING TO ROLE
        function renderSidebar() {
            const menu = document.getElementById('nav-menu');
            menu.innerHTML = '';

            navItems.forEach(item => {
                if (item.roles.includes(currentUserRole)) {
                    const activeClass = currentView === item.id 
                        ? 'bg-brand-50 text-brand-600 dark:bg-brand-900/40 dark:text-brand-300 font-semibold' 
                        : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700/50';

                    menu.innerHTML += `
                        <button onclick="navigate('${item.id}')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm transition-all duration-150 ${activeClass}">
                            <i class="fa-solid ${item.icon} w-5 text-center"></i>
                            <span>${item.label}</span>
                        </button>
                    `;
                }
            });
        }

        // NAVIGATION ENGINE
        function navigate(viewId) {
            currentView = viewId;
            renderSidebar();
            const main = document.getElementById('main-view');
            
            // GSAP Fade out & In transition
            gsap.to(main, { opacity: 0, y: 10, duration: 0.15, onComplete: () => {
                main.innerHTML = getPageTemplate(viewId);
                animatePageElements();
                gsap.to(main, { opacity: 1, y: 0, duration: 0.25 });
            }});

            // Close mobile sidebar on select
            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
            }
        }

        // PAGE TEMPLATES
        function getPageTemplate(viewId) {
            switch(viewId) {
                case 'dashboard':
                    return `
                        <div class="space-y-6">
                            <!-- Hero Banner -->
                            <div data-animate class="relative overflow-hidden rounded-3xl bg-gradient-to-r from-brand-600 via-indigo-600 to-purple-600 p-6 md:p-8 text-white shadow-xl">
                                <div class="relative z-10 max-w-xl">
                                    <span class="inline-block px-3 py-1 bg-white/20 backdrop-blur-md rounded-full text-xs font-semibold mb-3">Portal Acadêmico 2026</span>
                                    <h1 class="text-2xl md:text-4xl font-extrabold tracking-tight mb-2">Bem-vindo(a) ao EduConnect!</h1>
                                    <p class="text-brand-100 text-sm md:text-base mb-6">Acompanhe suas aulas, gerencie entregas, agende salas de estudo e mantenha-se em dia com sua rotina universitária.</p>
                                    <div class="flex flex-wrap gap-3">
                                        <button onclick="navigate('salas')" class="bg-white text-brand-600 hover:bg-brand-50 px-5 py-2.5 rounded-xl font-bold text-sm shadow-md transition-all">
                                            <i class="fa-solid fa-calendar-plus mr-2"></i>Reservar Sala de Estudo
                                        </button>
                                        <button onclick="navigate('cursos')" class="bg-brand-700/50 hover:bg-brand-700 text-white border border-white/20 px-5 py-2.5 rounded-xl font-semibold text-sm transition-all">
                                            Ver Minhas Aulas
                                        </button>
                                    </div>
                                </div>
                                <div class="absolute right-4 bottom-0 opacity-20 md:opacity-40 pointer-events-none transform translate-x-10 translate-y-6">
                                    <i class="fa-solid fa-graduation-cap text-[220px]"></i>
                                </div>
                            </div>

                            <!-- Metrics Grid -->
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                ${renderStatCard("CR Geral", "8,9", "fa-chart-line", "text-emerald-500", "Top 5% da turma")}
                                ${renderStatCard("Frequência", "96%", "fa-user-check", "text-blue-500", "Excelente marcas")}
                                ${renderStatCard("Atividades", "12/14", "fa-list-check", "text-purple-500", "2 pendentes")}
                                ${renderStatCard("Livros Salvos", "5", "fa-bookmark", "text-amber-500", "Biblioteca Virtual")}
                            </div>

                            <!-- Content Grid -->
                            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                <!-- Próximas Aulas & Tarefas -->
                                <div class="lg:col-span-2 space-y-6">
                                    <div data-animate class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                                        <div class="flex justify-between items-center mb-4">
                                            <h3 class="font-bold text-slate-800 dark:text-white flex items-center gap-2">
                                                <i class="fa-solid fa-clock text-brand-500"></i> Cronograma de Hoje
                                            </h3>
                                            <span class="text-xs text-slate-500">Segunda-feira, 26 de Outubro</span>
                                        </div>
                                        <div class="space-y-3">
                                            <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-700/40 border border-slate-100 dark:border-slate-700 flex justify-between items-center">
                                                <div class="flex items-center gap-3">
                                                    <div class="w-10 h-10 rounded-lg bg-blue-100 text-blue-600 dark:bg-blue-900/40 dark:text-blue-400 flex items-center justify-center font-bold">19h</div>
                                                    <div>
                                                        <h4 class="font-semibold text-sm text-slate-800 dark:text-white">Programação FrontEnd SPA</h4>
                                                        <p class="text-xs text-slate-500">Lab 04 • Bloco B • Prof. Ana</p>
                                                    </div>
                                                </div>
                                                <span class="text-xs bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300 font-semibold px-2.5 py-1 rounded-full">Confirmada</span>
                                            </div>
                                            <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-700/40 border border-slate-100 dark:border-slate-700 flex justify-between items-center">
                                                <div class="flex items-center gap-3">
                                                    <div class="w-10 h-10 rounded-lg bg-purple-100 text-purple-600 dark:bg-purple-900/40 dark:text-purple-400 flex items-center justify-center font-bold">21h</div>
                                                    <div>
                                                        <h4 class="font-semibold text-sm text-slate-800 dark:text-white">UX/UI Design System</h4>
                                                        <p class="text-xs text-slate-500">Sala 202 • Bloco A • Prof. Carlos</p>
                                                    </div>
                                                </div>
                                                <span class="text-xs bg-slate-200 text-slate-600 dark:bg-slate-600 dark:text-slate-300 font-semibold px-2.5 py-1 rounded-full">Em breve</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Quadros de Avisos -->
                                <div data-animate class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                                    <h3 class="font-bold text-slate-800 dark:text-white mb-4 flex items-center gap-2">
                                        <i class="fa-solid fa-bullhorn text-brand-500"></i> Avisos da Instituição
                                    </h3>
                                    <div class="space-y-4">
                                        ${mockData.avisos.map(aviso => `
                                            <div class="p-3.5 rounded-xl border border-slate-100 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-700/20">
                                                <span class="text-xs font-bold text-brand-600 dark:text-brand-400">${aviso.data}</span>
                                                <h4 class="font-semibold text-sm text-slate-800 dark:text-white mt-1">${aviso.titulo}</h4>
                                                <p class="text-xs text-slate-500 mt-1">${aviso.desc}</p>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;

                case 'salas':
                    return `
                        <div class="space-y-6">
                            <div data-animate class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div>
                                    <h1 class="text-2xl font-bold dark:text-white">Reserva de Salas de Estudo</h1>
                                    <p class="text-sm text-slate-500">Agende um espaço silencioso ou para trabalhos em grupo na biblioteca/blocos.</p>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                ${mockData.salasEstudo.map(sala => `
                                    <div data-animate class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col justify-between">
                                        <div>
                                            <div class="flex justify-between items-center mb-3">
                                                <span class="text-xs font-bold px-2.5 py-1 rounded-full ${sala.status === 'Livre' ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300' : 'bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-300'}">
                                                    ${sala.status}
                                                </span>
                                                <i class="fa-solid fa-door-closed text-slate-400 text-xl"></i>
                                            </div>
                                            <h3 class="font-bold text-slate-800 dark:text-white mb-2">${sala.nome}</h3>
                                            <p class="text-xs text-slate-500 mb-1"><i class="fa-solid fa-users mr-1"></i> ${sala.capacidade}</p>
                                            <p class="text-xs text-slate-500 mb-4"><i class="fa-solid fa-tv mr-1"></i> ${sala.recurso}</p>
                                        </div>
                                        <button onclick="openModalSala('${sala.nome}')" ${sala.status !== 'Livre' ? 'disabled' : ''} class="w-full py-2 bg-brand-600 hover:bg-brand-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white rounded-xl text-sm font-semibold transition-all">
                                            ${sala.status === 'Livre' ? 'Reservar Agora' : 'Indisponível'}
                                        </button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;

                case 'cursos':
                    return `
                        <div class="space-y-6">

                                        </div>
                                        <div>
                                            <label class="block text-xs font-semibold text-slate-500 mb-1">TÍTULO DA TAREFA</label>
                                            <input type="text" placeholder="Ex: Exercício 2 - React Components" required class="w-full border border-slate-200 dark:border-slate-600 dark:bg-slate-700 rounded-xl px-3 py-2 text-sm">

                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-500 mb-1">ANEXAR ARQUIVO (ZIP, PDF)</label>

                    `;

                case 'professor-painel':
                    return `
                        <div class="space-y-6">
                            <div data-animate>

                            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                <!-- Upload de Aula -->
                                <div data-animate class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
                                    <h3 class="font-bold text-slate-800 dark:text-white flex items-center gap-2"><i class="fa-solid fa-cloud-arrow-up text-brand-500"></i> Disponibilizar Nova Aula</h3>
                                    <form onsubmit="professorSubirAula(event)" class="space-y-3">
                                        <div>
                                            <label class="block text-xs font-semibold text-slate-500 mb-1">SELECIONE A TURMA</label>
                                            <select class="w-full border border-slate-200 dark:border-slate-600 dark:bg-slate-700 rounded-xl px-3 py-2 text-sm">
                                                <option>Programação FrontEnd SPA (Turma A)</option>
                                                <option>Engenharia de Software (Turma B)</option>

                                        </div>
                                        <div>
                                            <label class="block text-xs font-semibold text-slate-500 mb-1">TÍTULO DA AULA</label>

                                        </div>
                                        <div>
                                            <label class="block text-xs font-semibold text-slate-500 mb-1">LINK DO VÍDEO / MATERIAL</label>

                                        <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-2.5 rounded-xl text-sm transition-all shadow-md">Publicar Material</button>
                                    </form>
                                </div>

                                <!-- Lançamento de Notas -->
                                <div data-animate class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
                                    <h3 class="font-bold text-slate-800 dark:text-white flex items-center gap-2"><i class="fa-solid fa-pen-to-square text-brand-500"></i> Atividades Pendentes de Nota</h3>
                                    <div class="space-y-3">
                                        ${mockData.atividadesEnviadas.map(a => `
                                            <div class="p-4 rounded-xl border border-slate-100 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-700/30 flex justify-between items-center">

                                                    <h4 class="font-semibold text-sm dark:text-white">${a.titulo}</h4>

                case 'biblioteca':
                    return `
                        <div class="space-y-6">
                            <div data-animate>
                                <h1 class="text-2xl font-bold dark:text-white">Biblioteca Virtual</h1>
                                <p class="text-sm text-slate-500">Acesse milhares de livros, artigos científicos e periódicos acadêmicos online.</p>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                                ${renderBookCard("Engenharia de Software Moderna", "Marco Tulio Valente", "2020", "https://images.unsplash.com/photo-1532012197267-da84d127e765?auto=format&fit=crop&q=80&w=300")}
                                ${renderBookCard("Design Systems Responsivos", "Ethan Marcotte", "2021", "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&q=80&w=300")}
                                ${renderBookCard("Estruturas de Dados em JS", "Loiane Groner", "2019", "https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&q=80&w=300")}
                            </div>
                        </div>
                    `;

                case 'webmail':
                    return `
                        <div class="space-y-6">
                            <div data-animate class="flex justify-between items-center">
                                <div>
                                    <h1 class="text-2xl font-bold dark:text-white">Webmail Acadêmico</h1>
                                    <p class="text-sm text-slate-500">Caixa de entrada institucional integrada.</p>
                                </div>
                                <button onclick="showToast('Nova mensagem iniciada')" class="bg-brand-600 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-brand-700"><i class="fa-solid fa-plus mr-2"></i>Escrever</button>
                            </div>

                            <div data-animate class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 divide-y divide-slate-100 dark:divide-slate-700 shadow-sm overflow-hidden">
                                <div class="p-4 hover:bg-slate-50 dark:hover:bg-slate-700/50 flex items-center justify-between cursor-pointer">
                                    <div class="flex items-center gap-3">
                                        <div class="w-2 h-2 rounded-full bg-brand-600"></div>
                                        <span class="font-bold text-sm dark:text-white">Coordenação de Ciência da Computação</span>
                                    </div>
                                    <span class="text-xs text-slate-400">10:42 AM</span>
                                </div>
                                <div class="p-4 hover:bg-slate-50 dark:hover:bg-slate-700/50 flex items-center justify-between cursor-pointer">
                                    <div class="flex items-center gap-3">
                                        <div class="w-2 h-2 rounded-full bg-transparent"></div>
                                        <span class="text-sm text-slate-600 dark:text-slate-300">Prof. Carlos (UX/UI) - Devolutiva do Projeto 1</span>
                                    </div>
                                    <span class="text-xs text-slate-400">Ontem</span>
                                </div>
                            </div>
                        </div>
                    `;

                case 'sac':
                    return `
                        <div class="space-y-6 max-w-2xl">
                            <div data-animate>
                                <h1 class="text-2xl font-bold dark:text-white">SAC & Atendimento ao Aluno</h1>
                                <p class="text-sm text-slate-500">Abra um chamado para secretaria, financeiro ou suporte técnico.</p>
                            </div>

                            <form data-animate onsubmit="enviarChamadoSac(event)" class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-500 mb-1">DEPARTAMENTO</label>
                                    <select class="w-full border border-slate-200 dark:border-slate-600 dark:bg-slate-700 rounded-xl px-3 py-2 text-sm">
                                        <option>Secretaria Acadêmica</option>
                                        <option>Setor Financeiro</option>
                                        <option>Suporte de TI / Portal</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-500 mb-1">ASSUNTO</label>
                                    <input type="text" placeholder="Ex: Solicitação de Histórico Escolar" required class="w-full border border-slate-200 dark:border-slate-600 dark:bg-slate-700 rounded-xl px-3 py-2 text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-500 mb-1">MENSAGEM / DETALHES</label>
                                    <textarea rows="4" placeholder="Descreva sua solicitação com detalhes..." required class="w-full border border-slate-200 dark:border-slate-600 dark:bg-slate-700 rounded-xl px-3 py-2 text-sm"></textarea>
                                </div>
                                <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-2.5 rounded-xl text-sm transition-all shadow-md">Abrir Protocolo de Atendimento</button>
                            </form>
                        </div>
                    `;

                case 'perfil':
                    return `
                        <div class="space-y-6 max-w-2xl">
                            <div data-animate>
                                <h1 class="text-2xl font-bold dark:text-white">Meu Perfil</h1>
                                <p class="text-sm text-slate-500">Atualize suas informações pessoais e credenciais.</p>
                            </div>

                            <form data-animate onsubmit="salvarPerfil(event)" class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
                                <div class="flex items-center gap-4 mb-4">
                                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=150" class="w-16 h-16 rounded-full object-cover border-2 border-brand-500">
                                    <button type="button" onclick="showToast('Selecione uma foto do dispositivo')" class="px-3 py-1.5 border border-slate-200 dark:border-slate-600 rounded-xl text-xs font-semibold hover:bg-slate-50 dark:hover:bg-slate-700">Alterar Foto</button>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-500 mb-1">NOME COMPLETO</label>
                                    <input type="text" value="Maria Silva" required class="w-full border border-slate-200 dark:border-slate-600 dark:bg-slate-700 rounded-xl px-3 py-2 text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-500 mb-1">E-MAIL INSTITUCIONAL</label>
                                    <input type="email" value="maria.silva@educonnect.edu.br" required class="w-full border border-slate-200 dark:border-slate-600 dark:bg-slate-700 rounded-xl px-3 py-2 text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-500 mb-1">CURSO</label>
                                    <input type="text" value="Engenharia de Software" readonly class="w-full bg-slate-100 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl px-3 py-2 text-sm">
                                </div>
                                <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-2.5 rounded-xl text-sm transition-all shadow-md">Salvar Alterações</button>
                            </form>
                        </div>
                    `;

                default:
                    return `<div class="p-8 text-center"><h2 class="text-xl font-bold">Página não encontrada (404)</h2></div>`;
            }
        }

        // COMPONENT HELPER FUNCTIONS
        function renderStatCard(title, value, icon, colorClass, subtext) {
            return `
                <div data-animate class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center justify-between">
                    <div>
                        <span class="text-xs font-medium text-slate-400 block mb-1">${title}</span>
                        <span class="text-2xl font-bold dark:text-white">${value}</span>
                        <span class="text-[11px] text-slate-500 block mt-1">${subtext}</span>
                    </div>
                    <div class="w-12 h-12 rounded-2xl bg-slate-50 dark:bg-slate-700 flex items-center justify-center ${colorClass} text-xl">
                        <i class="fa-solid ${icon}"></i>
                    </div>
                </div>
            `;
        }

        function renderBookCard(title, author, year, coverUrl) {
            return `
                <div data-animate class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 overflow-hidden shadow-sm flex flex-col justify-between">
                    <img src="${coverUrl}" class="h-48 w-full object-cover">
                    <div class="p-4 flex-1 flex flex-col justify-between">
                        <div>
                            <h4 class="font-bold text-sm text-slate-800 dark:text-white mb-1">${title}</h4>
                            <p class="text-xs text-slate-500">${author} • ${year}</p>
                        </div>
                        <button onclick="showToast('Abrindo e-reader...')" class="mt-4 w-full py-2 bg-slate-100 dark:bg-slate-700 hover:bg-brand-600 hover:text-white dark:hover:bg-brand-600 text-slate-700 dark:text-slate-200 font-semibold rounded-xl text-xs transition-all">Ler Agora</button>
                    </div>
                </div>
            `;
        }

        // ANIMATIONS WITH GSAP
        function animatePageElements() {
            gsap.from("[data-animate]", {
                opacity: 0,
                y: 20,
                duration: 0.4,
                stagger: 0.08,
                ease: "power2.out"
            });
        }

        // INTERACTION HANDLERS & MODALS
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        }

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            const icon = document.getElementById('theme-icon');
            if (document.documentElement.classList.contains('dark')) {
                icon.className = 'fa-solid fa-sun';
            } else {
                icon.className = 'fa-solid fa-moon';
            }
        }

        function toggleUserRole() {
            currentUserRole = currentUserRole === 'aluno' ? 'professor' : 'aluno';
            document.getElementById('role-badge').innerText = currentUserRole === 'aluno' ? 'Modo Aluno' : 'Modo Professor';
            document.getElementById('user-role-sidebar').innerText = currentUserRole === 'aluno' ? 'Aluno • Eng. de Software' : 'Docente • Depto TI';
            renderSidebar();
            navigate(currentUserRole === 'aluno' ? 'dashboard' : 'professor-painel');
            showToast(`Alternado para a visão de ${currentUserRole.toUpperCase()}`);
        }

        function openModalSala(nomeSala) {
            document.getElementById('sala-nome-modal').value = nomeSala;
            const modal = document.getElementById('modal-sala');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal(idModal) {
            const modal = document.getElementById(idModal);
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function confirmarReservaSala(e) {
            e.preventDefault();
            closeModal('modal-sala');
            showToast("Sala de estudo reservada com sucesso! Confirmação enviada por e-mail.");
        }

        function enviarAtividadeAluno(e) {
            e.preventDefault();
            showToast("Atividade enviada com sucesso para o professor!");
            e.target.reset();
        }

        function professorSubirAula(e) {
            e.preventDefault();
            showToast("Nova aula e material publicados para os alunos!");
            e.target.reset();
        }

        function darNotaProfessor(tituloAtividade) {
            const nota = prompt(`Digite a nota para a atividade "${tituloAtividade}":`, "10.0");
            if (nota !== null) {
                showToast(`Nota ${nota} atribuída com sucesso!`);
            }
        }

        function enviarChamadoSac(e) {
            e.preventDefault();
            showToast("Protocolo de atendimento gerado com sucesso! Resposta em até 24h.");
            e.target.reset();
        }

        function salvarPerfil(e) {
            e.preventDefault();
            showToast("Informações do perfil atualizadas!");
        }

        function toggleNotifications() {
            showToast("Você não possui novas notificações não lidas.");
        }

        // CUSTOM TOAST SYSTEM
        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-slate-900 text-white dark:bg-white dark:text-slate-900 px-4 py-3 rounded-xl shadow-2xl text-xs font-semibold flex items-center gap-2 border border-slate-700/50';
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400 dark:text-emerald-600"></i> ${message}`;
            
            container.appendChild(toast);
            gsap.from(toast, { opacity: 0, y: 20, duration: 0.3 });

            setTimeout(() => {
                gsap.to(toast, { opacity: 0, y: -10, duration: 0.3, onComplete: () => toast.remove() });
            }, 3500);
        }
    </script>
</body>
</html>
